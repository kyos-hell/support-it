# Les 13 tickets, dans l'ordre de génération. EX-1011 lit EX-1001 : EX-1001 doit exister avant.
# Champs : reference, nature, domaines (validés ; le premier est celui chargé en premier),
# proposes (défaut = domaines), premier_domaine (domaine chargé en premier quand il diffère :
# le serveur dérive l'escalade), signaux [{id, preuve}], selon_cas (une section chargée par get_context),
# questions, verifications, recherche (tags), lit (référence d'un cas publié à lire),
# plan, actions (une par appel ; actions_en_un_appel: true pour l'anomalie 17),
# contradictions, mises_a_jour_contexte, conclusion, tags (≤ 5, bibliothèque),
# resolu_par, duree (minutes, par antidatage du brouillon), publier (défaut true).
tickets:
  - reference: EX-1001
    nature: incident
    domaines: [reseau]
    symptome: "Depuis ce matin les télétravailleurs en VPN n'accèdent plus au partage sur srv-fs-01, au bureau ça marche"
    signaux:
      - { id: depend-du-lieu, preuve: "en VPN non, au bureau ça marche" }
