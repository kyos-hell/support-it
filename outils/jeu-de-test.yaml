# Jeu de données de test (plan-after-beta.md §3.1) — entreprise fictive « Exemple SAS ».
# Lu par outils/jeu-de-test.mjs, qui pilote le serveur MCP construit : les fichiers
# de l'installation sont ceux que le serveur fabrique. Rien ici n'est livré ;
# tout est fictif (plages 10.x et 192.0.2.x, noms inventés).
#
# Ce qu'on modifie ici, pas dans le script : le contenu des sections, les tickets,
# les tags client. Les anomalies sont listées en fin de fichier ; celles marquées
# « édition » sont posées par le script après la génération.

entreprise: Exemple SAS

# L'étage client de la bibliothèque de tags (installation/tags.yaml).
tags_client:
  general: [m365, azure, agence-nord]
  reseau: [vpn-site-a-site]
  poste-de-travail: [app-compta]
  applicatif: [app-compta, erp-heberge]

