  general/plateformes: |
    | Plateforme | Type | Identifiants utiles | Pièges connus | Conventions | Administration |
    | --- | --- | --- | --- | --- | --- |
    | Salle serveur Siège | salle serveur, deux baies | hyperviseur hv-siege-01 et hv-siege-02, stockage partagé baie-siege | les deux hyperviseurs n'ont pas la même version de firmware ; une VM migrée sur hv-siege-02 perd parfois sa carte réseau virtuelle si le VLAN n'est pas déclaré sur le second hôte | VM nommées srv-ROLE-NN, un VLAN par usage, snapshots supprimés sous 48 h | console de l'hyperviseur, compte admin nominatif, MFA obligatoire depuis 2026 |
    | Tenant M365 | SaaS (exemplesas.onmicrosoft.com) | tenant unique, licences E3 pour tous, E5 pour la direction | la synchronisation avec l'AD passe par srv-ad-01 (Entra Connect) : un compte créé directement dans le portail n'est pas repris par l'AD et finit en doublon ; le password writeback est activé, ce qui masque un mot de passe expiré côté AD | boîtes partagées préfixées bp-, groupes M365 préfixés g365- | centre d'administration M365, rôles délégués au support (helpdesk, gestionnaire de licences) |
    | Abonnement Azure « Prod » | cloud IaaS/PaaS | un abonnement, région France Centre, groupe de ressources par application (rg-APP-prod) | les NSG sont gérés à part par le réseau : ouvrir un flux vers une VM Azure demande une règle NSG ET une règle sur le pare-feu du Siège ; les coûts partent vite avec les disques premium oubliés après suppression d'une VM | ressources taguées Application, Environnement, Propriétaire ; pas de ressource hors groupe | portail Azure, rôle Contributeur par groupe de ressources, Lecteur pour le support |
    | ERP hébergé | SaaS métier (éditeur Logiciels du Nord) | instance dédiée, accès par navigateur, SSO M365 | l'éditeur applique ses mises à jour le dimanche matin sans prévenir ; une interface CSV vers app-compta tourne la nuit et casse si l'export contient un caractère spécial | comptes créés par l'éditeur sur demande du référent métier, jamais par le support | portail client de l'éditeur, ticket obligatoire |
    | Sauvegarde | appliance de sauvegarde srv-bkp-01 | dépôt local + copie externalisée chiffrée chez un prestataire | la rétention n'est pas appliquée automatiquement sur le dépôt local : il faut lancer la purge à la main quand le volume dépasse 85 % ; la copie externalisée n'inclut pas les VM de test | un job par serveur, nommé bkp-SERVEUR | console de l'appliance, compte partagé de l'équipe infra (à nominativiser) |
