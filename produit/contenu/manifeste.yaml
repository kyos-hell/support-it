# Manifeste du produit — lu par le serveur MCP, rendu au triage.
# Il déclare des domaines, jamais des chemins : la convention résout
# contenu/domaines/<id>/ et installation/contexte/<id>.md ; le contexte transverse
# est contenu/general/contexte.exemple.md (id « general »).
# Écrit à la main, validé par « node dist/cli.js valider » contre les dossiers.
# Chaque signal a un identifiant kebab-case, unique dans tout le manifeste : le
# modèle coche des identifiants, il ne rédige pas (décision 2 du 2026-09-17).
# Depuis la campagne 0.3.0-beta (E10, O5, 2026-09-20) : chaque domaine porte
# un signal de DEMANDE (« objet-… » : sur quoi porte l'état cible), et le
# domaine hors-perimetre, décrit sans dossier, donne ses signaux à ce qui
# n'est pas du support IT — le serveur exige un signal pour toute nature.
version: 1

natures:
  incident: "« ça ne marche plus » — un état antérieur s'est dégradé"
  demande: "« je veux que » — un état cible, rien n'est cassé"

max_domaines: 2
# Un signal sert à choisir entre deux domaines ; au-delà de six par domaine,
# ce n'est plus un signal mais un catalogue de symptômes (décision 2).
max_signaux: 6

questions_rattrapage:
  - "Qui est touché ? Une personne, un groupe corrélé à un lieu ou un lien, ou tout le monde ?"
  - "Est-ce que ça a déjà fonctionné, et depuis quand ça ne fonctionne plus ?"
  - "Est-ce que ça dépend d'où ou de comment on se connecte ?"

domaines:
  - id: reseau
    libelle: Réseau
    statut: beta
    suit: le chemin d'accès (lien, site, VPN, wifi)
    signaux:
      - id: depend-du-lieu
        libelle: dépend du lieu ou du lien (marche au bureau, pas en VPN ; site A oui, site B non ; filaire oui, wifi non)
      - id: tous-services-touches
        libelle: tous les services touchés en même temps
      - id: population-lieu-lien
        libelle: population corrélée à un lieu ou un lien (un étage, un site, les télétravailleurs)
      - id: symptomes-transport
        libelle: symptômes de transport (timeout, coupures intermittentes, lenteur sur tout)
      - id: objet-chemin
        libelle: (demande) l'état cible porte sur un lien, un flux, un VLAN, le wifi ou le VPN
    tags: [vpn, dns, proxy-internet, wifi, ouverture-flux, creation-vlan]

  - id: systeme
    libelle: Système
    statut: beta
    suit: un service partagé, quel que soit le chemin
    signaux:
      - id: un-service-touche
        libelle: un service précis touché, les autres vont bien
      - id: independant-du-chemin
        libelle: indépendant du chemin d'accès (mêmes symptômes en VPN, sur site, depuis tout poste)
      - id: tous-utilisateurs-du-service
        libelle: population = tous les utilisateurs du service, où qu'ils soient
      - id: symptomes-serveur
        libelle: symptômes côté serveur (disque plein, service arrêté, certificat expiré, sauvegarde en échec)
      - id: objet-service
        libelle: (demande) l'état cible porte sur un serveur, un partage, une sauvegarde, un certificat, une tâche
    tags: [virtualisation, stockage, sauvegarde, messagerie, certificat, tache-planifiee, creation-partage, restauration-fichier]

  - id: poste-de-travail
    libelle: Poste de travail
    statut: beta
    suit: la machine d'un utilisateur, côté logiciel
    signaux:
      - id: suit-la-machine
        libelle: suit la machine (même utilisateur sur un autre poste, pas de problème)
      - id: un-seul-poste
        libelle: un seul poste touché, services et réseau sains pour les autres
      - id: os-repond
        libelle: le poste démarre et l'OS répond, mais quelque chose s'y comporte mal
      - id: objet-poste
        libelle: (demande) l'état cible porte sur la machine d'un utilisateur, côté logiciel (installer, préparer, configurer)
    tags: [application, profil, securite, impression, mise-a-jour, installation-logiciel, preparation-poste]

  - id: materiel
    libelle: Matériel
    statut: beta
    suit: un objet physique
    signaux:
      - id: symptomes-physiques
        libelle: symptômes physiques (rien ne s'allume, bruit, surchauffe, écran noir ou fissuré)
      - id: persiste-hors-logiciel
        libelle: persiste hors logiciel (avant l'OS, ou sur un environnement sain)
      - id: echange-objet-resout
        libelle: l'échange de l'objet fait disparaître le problème
      - id: objet-physique
        libelle: (demande) l'état cible porte sur un objet à commander, remplacer, réparer ou prêter
    tags: [sav, stock, peripherique, salle-technique, garantie, remplacement-materiel, commande-materiel]

  - id: identite
    libelle: Identité et annuaire
    statut: beta
    suit: le compte d'une personne, quel que soit le poste
    signaux:
      - id: suit-la-personne
        libelle: suit la personne (mêmes symptômes quel que soit le poste)
      - id: service-repond-mais-refuse
        libelle: le service répond mais refuse (mot de passe rejeté, accès refusé, compte verrouillé)
      - id: correle-evenement-compte
        libelle: corrélé à un événement de compte (changement de mot de passe, de service, retour de congés)
      - id: objet-compte
        libelle: (demande) l'état cible porte sur un compte, un groupe, un droit d'accès
    tags: [synchronisation, droits-acces, compte-service, verrouillage, mfa, creation-compte, depart-collaborateur, attribution-droits]

  - id: applicatif
    libelle: Applicatif
    statut: beta
    suit: une fonction d'une application qui reste accessible
    signaux:
      - id: acces-ok-dedans-ko
        libelle: l'accès fonctionne, c'est dedans que ça se passe mal
      - id: lie-action-ou-donnee
        libelle: lié à une action ou une donnée précise (tel écran, tel enregistrement)
      - id: reproductible-partout
        libelle: reproductible depuis tout poste et tout compte aux mêmes droits
      - id: objet-fonction-applicative
        libelle: (demande) l'état cible porte sur un paramétrage, une habilitation, une intégration d'une application
    tags: [editeur, integration, environnement, acces-applicatif, parametrage, habilitation-applicative, mise-a-jour-applicative]

  # Décrit, sans dossier : le serveur refuse de le charger, le triage répond
  # « hors des domaines couverts » et propose la clôture hors-domaines-couverts.
  - id: hors-perimetre
    libelle: Hors du support IT
    statut: decrit
    suit: rien que le support exploite — travaux, achat, prestation, bâtiment, organisation
    signaux:
      - id: travaux-batiment
        libelle: travaux ou aménagement (câblage, prise à poser, cloison, déménagement)
      - id: achat-ou-devis
        libelle: un devis, une commande ou un contrat à passer avec un tiers, sans objet du parc en cause
      - id: hors-informatique
        libelle: le sujet n'est ni un service, ni un compte, ni un poste, ni un objet du parc, ni le réseau
    tags: []
