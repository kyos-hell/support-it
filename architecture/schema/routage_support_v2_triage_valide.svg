<svg width="100%" viewBox="0 0 680 1140" role="img" xmlns="http://www.w3.org/2000/svg"><title>Routage support v7 — natures incident et demande</title><desc>Flux : /support, triage (nature incident ou demande, puis domaines ; validation si ambigu), chargement du skill — ou de demandes.md si nature demande — puis du contexte, instruction du cas (diagnostic d'incident ou étude de demande) avec boucle d'escalade vers un re-triage, puis recherche en base de connaissances une fois le cas instruit — un cas similaire fournit une solution éprouvée au plan d'action. Clôture par save_ticket, publication par publish_kb qui alimente l'index de recherche.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<!-- /support -->
<rect x="210" y="40" width="260" height="56" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-size:14px;font-weight:500">/support</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-size:12px">unique porte d'entrée</text>
<!-- Triage -->
<rect x="190" y="114" width="300" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="340" y="134" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Triage</text>
<text x="340" y="152" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">nature (incident / demande), puis domaines — sans appel</text>
<!-- Validation du triage -->
<rect x="390" y="200" width="250" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<text x="515" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500">Validation du triage</text>
<text x="515" y="238" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px">ajout ou retrait de domaines</text>
<!-- Chargement du skill -->
<rect x="390" y="290" width="250" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="515" y="310" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Chargement du skill</text>
<text x="515" y="328" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">MCP · load_skill — demandes.md si demande</text>
<!-- Chargement du contexte -->
<rect x="390" y="380" width="250" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="515" y="400" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Chargement du contexte</text>
<text x="515" y="418" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">MCP · get_context(sections)</text>
<!-- Question au technicien -->
<rect x="60" y="380" width="230" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<text x="175" y="400" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500">Question au technicien</text>
<text x="175" y="418" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px">si section manquante</text>
<!-- Diagnostic -->
<rect x="210" y="470" width="260" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="340" y="490" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Instruction du cas</text>
<text x="340" y="508" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">diagnostic incident · étude demande</text>
<!-- Recherche base de connaissances -->
<rect x="190" y="560" width="300" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="340" y="580" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Recherche base de connaissances</text>
<text x="340" y="598" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">MCP · search_kb(tags), cas instruit</text>
<!-- Cas similaire -->
<rect x="60" y="650" width="230" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="175" y="670" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Cas similaire</text>
<text x="175" y="688" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">solution éprouvée, pas un appel</text>
<!-- Plan d'action -->
<rect x="190" y="740" width="300" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<text x="340" y="760" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500">Plan d'action proposé</text>
<text x="340" y="778" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px">tu valides ou tu corriges</text>
<!-- Actions correctives -->
<rect x="190" y="830" width="300" height="56" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px"/>
<text x="340" y="850" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-size:14px;font-weight:500">Actions correctives</text>
<text x="340" y="868" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-size:12px">hors système, par l'humain</text>
<!-- Clôture -->
<rect x="190" y="920" width="300" height="56" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/>
<text x="340" y="940" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-size:14px;font-weight:500">Clôture du ticket</text>
<text x="340" y="958" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-size:12px">MCP · save_ticket()</text>
<!-- Publication -->
<rect x="190" y="1010" width="300" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<text x="340" y="1030" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500">Publication en base</text>
<text x="340" y="1048" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px">MCP · publish_kb(), après validation</text>
<!-- Flèches -->
<g fill="none" style="stroke:rgb(137, 135, 129);stroke-width:1.5px">
<path d="M340 96 L340 110" marker-end="url(#arrow)"/>
<path d="M340 184 L515 184 L515 198" marker-end="url(#arrow)"/>
<path d="M515 256 L515 286" marker-end="url(#arrow)"/>
<path d="M340 170 L340 318 L386 318" marker-end="url(#arrow)"/>
<path d="M515 346 L515 376" marker-end="url(#arrow)"/>
<path d="M388 398 L296 398" marker-end="url(#arrow)"/>
<path d="M294 422 L386 422" marker-end="url(#arrow)"/>
<path d="M515 436 L515 450 L340 450 L340 466" marker-end="url(#arrow)"/>
<path d="M340 526 L340 556" marker-end="url(#arrow)"/>
<path d="M340 616 L340 630 L175 630 L175 646" marker-end="url(#arrow)"/>
<path d="M340 616 L340 736" marker-end="url(#arrow)"/>
<path d="M175 706 L175 764 L186 764" marker-end="url(#arrow)"/>
<path d="M340 796 L340 826" marker-end="url(#arrow)"/>
<path d="M340 886 L340 916" marker-end="url(#arrow)"/>
<path d="M340 976 L340 1006" marker-end="url(#arrow)"/>
<path d="M190 1038 L40 1038 L40 588 L186 588" marker-end="url(#arrow)"/>
<path d="M472 498 L660 498 L660 318 L644 318" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
</g>
<!-- Labels de flèches -->
<g text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-size:12px">
<text x="440" y="174">ambigu</text>
<text x="300" y="230">cas net</text>
<text x="565" y="482">escalade : re-triage</text>
<text x="240" y="622">cas trouvé</text>
<text x="378" y="660">aucun cas</text>
<text x="118" y="1060">alimente l'index</text>
</g>
<!-- Légende -->
<rect x="40" y="1082" width="14" height="14" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/>
<rect x="195" y="1082" width="14" height="14" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<rect x="320" y="1082" width="14" height="14" rx="4" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<rect x="475" y="1082" width="14" height="14" rx="4" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px"/>
<g dominant-baseline="central" style="fill:rgb(82, 81, 78);font-size:12px">
<text x="62" y="1089">entrée / sortie</text>
<text x="217" y="1089">automatique</text>
<text x="342" y="1089">ton avis requis</text>
<text x="497" y="1089">modifie l'état</text>
<text x="40" y="1112">MCP · = appel au serveur MCP — les étapes sans mention ne sortent pas du modèle</text>
</g>
</g></svg>
