<path d="M350 1156 L350 1276" marker-end="url(#arrow)"/>
<path d="M525 1246 L525 1264 L350 1264"/>
</g>
<!-- Boucles et branches (pointillés) -->
<g fill="none" style="stroke:rgb(94, 63, 160);stroke-width:1.5px;stroke-dasharray:5 4">
<path d="M40 678 L28 678 L28 228 L36 228" marker-end="url(#arrow)"/>
<path d="M120 96 L120 106 L14 106 L14 1218 L36 1218" marker-end="url(#arrow)"/>
<path d="M580 96 L580 106 L686 106 L686 1258 L165 1258 L165 1250" marker-end="url(#arrow)"/>
<path d="M290 1218 L396 1218" marker-end="url(#arrow)"/>
</g>
<g fill="none" style="stroke:rgb(15, 110, 86);stroke-width:1.5px;stroke-dasharray:5 4">
<path d="M480 574 L668 574 L668 142 L504 142" marker-end="url(#arrow)"/>
</g>
<!-- Libellés des flèches -->
<text x="440" y="178" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:11px">ambigu</text>
<text x="260" y="228" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:11px">cas net</text>
<text x="160" y="140" text-anchor="middle" dominant-baseline="central" style="fill:rgb(94, 63, 160);font-size:11px">réf. en cours</text>
<text x="679" y="358" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 679 358)" style="fill:rgb(15, 110, 86);font-size:11px">escalade : re-triage, nouveau load_skill, domaines validés en union</text>
<text x="21" y="450" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 21 450)" style="fill:rgb(94, 63, 160);font-size:11px">reprise, même id, passation enregistrée</text>
<text x="8" y="660" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 8 660)" style="fill:rgb(94, 63, 160);font-size:11px">hors ticket : remplissage, candidats d'abord, une section à la fois</text>
<text x="694" y="700" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 694 700)" style="fill:rgb(94, 63, 160);font-size:11px">hors ticket : audit — brouillons anciens, résolus non publiés, périmées, candidats, un par un sur oui</text>
<text x="150" y="758" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:11px">vide, ou autre vécu</text>
<text x="343" y="1208" text-anchor="middle" dominant-baseline="central" style="fill:rgb(94, 63, 160);font-size:11px">sur oui</text>
<!-- Légende -->
<g style="font-size:11px">
<rect x="40" y="1380" width="14" height="14" rx="3" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/><text x="60" y="1387" dominant-baseline="central" style="fill:rgb(68, 68, 65)">entrée / sortie</text>
<rect x="160" y="1380" width="14" height="14" rx="3" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/><text x="180" y="1387" dominant-baseline="central" style="fill:rgb(68, 68, 65)">automatique</text>
<rect x="270" y="1380" width="14" height="14" rx="3" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/><text x="290" y="1387" dominant-baseline="central" style="fill:rgb(68, 68, 65)">ton avis requis</text>
<rect x="390" y="1380" width="14" height="14" rx="3" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px"/><text x="410" y="1387" dominant-baseline="central" style="fill:rgb(68, 68, 65)">modifie l'état</text>
<rect x="500" y="1380" width="14" height="14" rx="3" style="fill:rgb(240, 235, 250);stroke:rgb(94, 63, 160);stroke-width:0.5px"/><text x="520" y="1387" dominant-baseline="central" style="fill:rgb(68, 68, 65)">écrit dans le temps (brouillon, contexte)</text>
<text x="40" y="1415" dominant-baseline="central" style="fill:rgb(95, 94, 90)">MCP · = appel au serveur MCP (neuf appels). Le serveur ne raisonne pas : il sert, refuse hors séquence, classe, dérive, écrit.</text>
<text x="40" y="1435" dominant-baseline="central" style="fill:rgb(95, 94, 90)">Le modèle n'a pas de choix sur la mécanique : domaines, signaux, tags, sections sont des enums ; identifiants, chemins, dates, durée viennent du serveur.</text>
<text x="40" y="1455" dominant-baseline="central" style="fill:rgb(95, 94, 90)">Trois points de validation humaine : triage ambigu, plan d'action, publication. Le contexte n'est jamais écrit sans un oui ; une réponse tracée = les mots du technicien.</text>
<text x="40" y="1475" dominant-baseline="central" style="fill:rgb(95, 94, 90)">L'hôte (.claude/settings.json, déposé par install) retire au modèle Bash, PowerShell, l'écriture dans installation/ et la lecture de kb/ et en-cours/.</text>
<text x="40" y="1495" dominant-baseline="central" style="fill:rgb(95, 94, 90)">Tout ce qui est écrit vit dans installation/ : en-cours/, tickets/, journal/, kb/, contexte/ (+ historique/), audits/. Le serveur fabrique tous les identifiants.</text>
</g>
</g>
</svg>
