<svg width="100%" viewBox="0 0 700 1640" role="img" xmlns="http://www.w3.org/2000/svg"><title>Routage support v4 — 0.3.0 : neuf appels, état de session, audit, contexte entretenu</title><desc>Flux : /support, triage (nature puis domaines par signaux cochés avec preuve, classement par le serveur ; validation si ambigu ; reprise par resume_ticket qui reconstruit l'état de session), point d'étape save_progress qui crée le brouillon, chargement du skill avec ses sections requises, get_context selon le cas (section vide : consigne et question ; périmée : à confirmer), instruction du cas avec escalade vers un re-triage, points d'étape (étape, escalades, cas lus dérivés par le serveur ; contradictions notées), pause et passation, recherche en base une fois le cas instruit (refusée avant), lecture du cas retenu par read_kb, plan d'action validé, actions une étape par tour par l'humain, clôture par load_skill(cloture) puis save_ticket (resolu_par demandé, durée active calculée), écriture du contexte par update_context après oui (colonnes du gabarit contrôlées), publication par publish_kb. Branches hors ticket : remplissage et audit, qui proposent un par un la file des candidats. L'hôte retire Bash et l'écriture dans installation/ au modèle.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<!-- /support -->
<rect x="220" y="40" width="260" height="56" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/>
<text x="350" y="60" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-size:14px;font-weight:500">/support</text>
<text x="350" y="78" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-size:12px">porte d'entrée · référence d'abord, jamais inventée</text>
<!-- Remplissage (hors ticket) -->
<rect x="40" y="40" width="160" height="56" rx="8" style="fill:rgb(240, 235, 250);stroke:rgb(94, 63, 160);stroke-width:0.5px"/>
<text x="120" y="60" text-anchor="middle" dominant-baseline="central" style="fill:rgb(64, 40, 120);font-size:14px;font-weight:500">Remplissage</text>
<text x="120" y="78" text-anchor="middle" dominant-baseline="central" style="fill:rgb(94, 63, 160);font-size:11px">hors ticket · load_skill</text>
<!-- Audit (hors ticket) -->
<rect x="500" y="40" width="160" height="56" rx="8" style="fill:rgb(240, 235, 250);stroke:rgb(94, 63, 160);stroke-width:0.5px"/>
<text x="580" y="60" text-anchor="middle" dominant-baseline="central" style="fill:rgb(64, 40, 120);font-size:14px;font-weight:500">Audit</text>
<text x="580" y="78" text-anchor="middle" dominant-baseline="central" style="fill:rgb(94, 63, 160);font-size:11px">hors ticket · rapport → audits/</text>
<!-- Triage -->
<rect x="200" y="114" width="300" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="350" y="134" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Triage</text>
<text x="350" y="152" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">MCP · load_skill(triage) : règles, manifeste, en cours</text>
<!-- Reprise -->
<rect x="40" y="200" width="160" height="56" rx="8" style="fill:rgb(240, 235, 250);stroke:rgb(94, 63, 160);stroke-width:0.5px"/>
<text x="120" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(64, 40, 120);font-size:14px;font-weight:500">Reprise</text>
<text x="120" y="238" text-anchor="middle" dominant-baseline="central" style="fill:rgb(94, 63, 160);font-size:11px">MCP · resume_ticket(réf) · session reconstruite</text>
<!-- Validation du triage -->
<rect x="400" y="200" width="250" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<text x="525" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500">Validation du triage</text>
<text x="525" y="238" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px">si ambigu · une question · ajout ou retrait</text>
<!-- Point d'étape : brouillon créé -->
<rect x="200" y="290" width="300" height="56" rx="8" style="fill:rgb(240, 235, 250);stroke:rgb(94, 63, 160);stroke-width:0.5px"/>
<text x="350" y="310" text-anchor="middle" dominant-baseline="central" style="fill:rgb(64, 40, 120);font-size:14px;font-weight:500">Point d'étape — brouillon créé</text>
<text x="350" y="328" text-anchor="middle" dominant-baseline="central" style="fill:rgb(94, 63, 160);font-size:12px">MCP · save_progress : symptôme tel quel, signaux {id, preuve}</text>
<!-- Chargement du skill -->
<rect x="200" y="380" width="300" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="350" y="400" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Chargement du skill</text>
<text x="350" y="418" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">MCP · load_skill(domaines, nature) + sections requises</text>
<!-- Chargement du contexte -->
<rect x="400" y="470" width="250" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="525" y="490" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Contexte selon le cas</text>
<text x="525" y="508" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">MCP · get_context(sections) · périmée : à confirmer</text>
<!-- Question au technicien -->
<rect x="40" y="470" width="250" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<text x="165" y="490" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500">Question au technicien</text>
<text x="165" y="508" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px">section vide, nom manquant · jamais une hypothèse</text>
<!-- Instruction -->
<rect x="220" y="560" width="260" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="350" y="580" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Instruction du cas</text>
<text x="350" y="598" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">une question, une commande, puis attendre · lecture seule</text>
<!-- Points d'étape -->
<rect x="400" y="650" width="250" height="56" rx="8" style="fill:rgb(240, 235, 250);stroke:rgb(94, 63, 160);stroke-width:0.5px"/>
<text x="525" y="670" text-anchor="middle" dominant-baseline="central" style="fill:rgb(64, 40, 120);font-size:14px;font-weight:500">Points d'étape</text>
<text x="525" y="688" text-anchor="middle" dominant-baseline="central" style="fill:rgb(94, 63, 160);font-size:12px">save_progress(id) · étape, escalades : dérivées</text>
<!-- Pause -->
<rect x="40" y="650" width="250" height="56" rx="8" style="fill:rgb(240, 235, 250);stroke:rgb(94, 63, 160);stroke-width:0.5px"/>
<text x="165" y="670" text-anchor="middle" dominant-baseline="central" style="fill:rgb(64, 40, 120);font-size:14px;font-weight:500">Pause · passation</text>
<text x="165" y="688" text-anchor="middle" dominant-baseline="central" style="fill:rgb(94, 63, 160);font-size:12px">pause: true, prochaine étape notée</text>
<!-- Recherche base de connaissances -->
<rect x="200" y="740" width="300" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="350" y="760" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Recherche base de connaissances</text>
<text x="350" y="778" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">MCP · search_kb(tags) · refusée avant le skill · rareté</text>
<!-- Lecture du cas retenu -->
<rect x="200" y="830" width="300" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="350" y="850" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Lecture du cas retenu</text>
<text x="350" y="868" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:12px">MCP · read_kb(id) · refusée avant la recherche</text>
<!-- Cas écarté -->
<rect x="40" y="830" width="130" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px"/>
<text x="105" y="850" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">Cas écarté</text>
<text x="105" y="868" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-size:11px">base vide ou autre vécu</text>
<!-- Plan d'action -->
<rect x="200" y="920" width="300" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<text x="350" y="940" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500">Plan d'action proposé</text>
<text x="350" y="958" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px">une étape = un geste · tu valides ou tu corriges</text>
<!-- Actions correctives -->
<rect x="200" y="1010" width="300" height="56" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px"/>
<text x="350" y="1030" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-size:14px;font-weight:500">Actions correctives</text>
<text x="350" y="1048" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-size:12px">par l'humain, une étape par tour · l'inattendu arrête</text>
<!-- Clôture -->
<rect x="200" y="1100" width="300" height="56" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/>
<text x="350" y="1120" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-size:14px;font-weight:500">Clôture du ticket</text>
<text x="350" y="1138" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-size:12px">MCP · load_skill(cloture) → save_ticket(id) · durée active</text>
<!-- Écriture du contexte -->
<rect x="400" y="1190" width="250" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<text x="525" y="1210" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500">Écriture du contexte</text>
<text x="525" y="1228" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px">MCP · update_context, une section, après oui</text>
<!-- File des candidats -->
<rect x="40" y="1190" width="250" height="56" rx="8" style="fill:rgb(240, 235, 250);stroke:rgb(94, 63, 160);stroke-width:0.5px"/>
<text x="165" y="1210" text-anchor="middle" dominant-baseline="central" style="fill:rgb(64, 40, 120);font-size:14px;font-weight:500">File des candidats</text>
<text x="165" y="1228" text-anchor="middle" dominant-baseline="central" style="fill:rgb(94, 63, 160);font-size:12px">questions, mises à jour, contradictions</text>
<!-- Publication -->
<rect x="200" y="1280" width="300" height="56" rx="8" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:0.5px"/>
<text x="350" y="1300" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);font-size:14px;font-weight:500">Publication en base</text>
<text x="350" y="1318" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-size:12px">MCP · publish_kb(id), résolu seulement, après oui</text>
<!-- Flèches -->
<g fill="none" style="stroke:rgb(137, 135, 129);stroke-width:1.5px">
<path d="M350 96 L350 110" marker-end="url(#arrow)"/>
<path d="M350 170 L350 184 L525 184 L525 198" marker-end="url(#arrow)"/>
<path d="M200 150 L120 150 L120 198" marker-end="url(#arrow)"/>
<path d="M525 256 L525 274 L350 274 L350 286" marker-end="url(#arrow)"/>
